<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../public/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../style/global.css">
    <link rel="stylesheet" href="admin.css">
    <title>Seção Admin</title>
</head>
<body>

    <header>

        <!-- Area de navegação -->
        <nav>
            <div id="logo-nome">
                <img src="../../../public/pato-logo.png" alt="Logo Pátolinopoles">
                <h1>Pátolinopoles</h1>
            </div>

            <!-- Perfil do Usuários -->
            <div id="perfil-user">
                <svg width="20" height="20" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 0.875C5.49797 0.875 3.875 2.49797 3.875 4.5C3.875 6.15288 4.98124 7.54738 6.49373 7.98351C5.2997 8.12901 4.27557 8.55134 3.50407 9.31167C2.52216 10.2794 2.02502 11.72 2.02502 13.5999C2.02502 13.8623 2.23769 14.0749 2.50002 14.0749C2.76236 14.0749 2.97502 13.8623 2.97502 13.5999C2.97502 11.8799 3.42786 10.7206 4.17091 9.9883C4.91536 9.25463 6.02674 8.87499 7.49995 8.87499C8.97317 8.87499 10.0846 9.25463 10.8291 9.98831C11.5721 10.7206 12.025 11.8799 12.025 13.5999C12.025 13.8623 12.2376 14.0749 12.5 14.0749C12.7623 14.075 12.975 13.8623 12.975 13.6C12.975 11.72 12.4778 10.2794 11.4959 9.31166C10.7244 8.55135 9.70025 8.12903 8.50625 7.98352C10.0187 7.5474 11.125 6.15289 11.125 4.5C11.125 2.49797 9.50203 0.875 7.5 0.875ZM4.825 4.5C4.825 3.02264 6.02264 1.825 7.5 1.825C8.97736 1.825 10.175 3.02264 10.175 4.5C10.175 5.97736 8.97736 7.175 7.5 7.175C6.02264 7.175 4.825 5.97736 4.825 4.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                
                <!-- Nome do usuário -->
                <p class="nome-usuario">Dono Da Lagoa</p>
            </div>
        </nav>

        <!-- div com a barra de pesquisa e a lupa -->
        <div id="container-barra-de-pesquisa">

            <!-- div com a barra de pesquisa -->
            <div id="barra-de-pesquisa">

                <!-- Barra de pesquisa -->
                <input type="text" name="barra-pesquisa" id="barra-pesquisa" placeholder="Procurar Usuários">

                <!-- Imagem da Lupa -->
                <svg class="img-lupa" width="22" height="22" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" ><path d="M10 6.5C10 8.433 8.433 10 6.5 10C4.567 10 3 8.433 3 6.5C3 4.567 4.567 3 6.5 3C8.433 3 10 4.567 10 6.5ZM9.30884 10.0159C8.53901 10.6318 7.56251 11 6.5 11C4.01472 11 2 8.98528 2 6.5C2 4.01472 4.01472 2 6.5 2C8.98528 2 11 4.01472 11 6.5C11 7.56251 10.6318 8.53901 10.0159 9.30884L12.8536 12.1464C13.0488 12.3417 13.0488 12.6583 12.8536 12.8536C12.6583 13.0488 12.3417 13.0488 12.1464 12.8536L9.30884 10.0159Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>

            </div>


            <!-- container do botão de pesquisa -->
            <div id="container-btn">
                <!-- botão de pesquisar -->
                <button id="btn-pesquisar" onclick="pesquisarUsuario()">Pesquisar</button>
            </div>

                <!-- Resultado da pesquisa -->
            <div id="container-resultado-da-pesquisa">
                <h2 class="resultado-pesquisa">Dono Da Lagoa</h2>
            </div>

        </div>
    
    </header>


    <main>

        <section id="container-avisos">
            
            <div id="aviso-comentario">
                <p>Os comentarios ainda esta em fase de desenvolvimento</p>
            </div>

        </section>

        <!-- Seção pesquisas -->
        <section id="secao-fazer-postagem">

                <!-- Formualrio com o textarea -->
                <form id="fomulario-postagem" method="POST">

                    <textarea name="escrever-postagem" id="escrever-postagem" cols="100"  rows="5" placeholder="Escreva aqui o seu Quack..."></textarea>
                    
                    <button id="btn-postar"  type="submit">Dar um Quack</button>

                </form>
        
        </section>

      

        <!-- seção aonde vai carregar os posts -->
        <section id="secao-postagens">

            <!-- container dos posts -->
            <article id="container-posts">

                <div class="posts">

                    <!-- div com o a foto de perfil, nome e data de postagem -->
                    <article class="container-nome-data-foto">
                        <!-- imagem com foto de perfil -->
                        <img class="foto-de-perfil" src="../../assets/image/FT PERFIL.png" alt="foto de perfil">

                        <div class="container-nome-data">
                            <h2 class="nome-usuario-post">Dono Da Lagoa</h2>
                            <p class="data-da-postagem">12/03/2026</p>
                        </div>

                    </article>


                    <!-- conteudo da postagem -->
                    <article class="container-conteudo-da-postagem">
                        <!-- conteudo -->
                        <p class="conteudo">Primeira Postagem Vista nessa rede social</p>
                    </article>


                    <!-- parte das curtidas -->
                    <article class="container-curtida">

                        <!--  -->
                        <div class="curtidas" onclick="curtida()">
                            <!-- imagem da curtida -->
                            <svg class="img-da-curtida" width="20" height="20" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.89346 2.35248C3.49195 2.35248 2.35248 3.49359 2.35248 4.90532C2.35248 6.38164 3.20954 7.9168 4.37255 9.33522C5.39396 10.581 6.59464 11.6702 7.50002 12.4778C8.4054 11.6702 9.60608 10.581 10.6275 9.33522C11.7905 7.9168 12.6476 6.38164 12.6476 4.90532C12.6476 3.49359 11.5081 2.35248 10.1066 2.35248C9.27059 2.35248 8.81894 2.64323 8.5397 2.95843C8.27877 3.25295 8.14623 3.58566 8.02501 3.88993C8.00391 3.9429 7.98315 3.99501 7.96211 4.04591C7.88482 4.23294 7.7024 4.35494 7.50002 4.35494C7.29765 4.35494 7.11523 4.23295 7.03793 4.04592C7.01689 3.99501 6.99612 3.94289 6.97502 3.8899C6.8538 3.58564 6.72126 3.25294 6.46034 2.95843C6.18109 2.64323 5.72945 2.35248 4.89346 2.35248ZM1.35248 4.90532C1.35248 2.94498 2.936 1.35248 4.89346 1.35248C6.0084 1.35248 6.73504 1.76049 7.20884 2.2953C7.32062 2.42147 7.41686 2.55382 7.50002 2.68545C7.58318 2.55382 7.67941 2.42147 7.79119 2.2953C8.265 1.76049 8.99164 1.35248 10.1066 1.35248C12.064 1.35248 13.6476 2.94498 13.6476 4.90532C13.6476 6.74041 12.6013 8.50508 11.4008 9.96927C10.2636 11.3562 8.92194 12.5508 8.00601 13.3664C7.94645 13.4194 7.88869 13.4709 7.83291 13.5206C7.64324 13.6899 7.3568 13.6899 7.16713 13.5206C7.11135 13.4709 7.05359 13.4194 6.99403 13.3664C6.0781 12.5508 4.73641 11.3562 3.59926 9.96927C2.39872 8.50508 1.35248 6.74041 1.35248 4.90532Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>

                            <p class="quantidade-curtidas">1</p>

                        </div>

                    </article>


                    <!-- container comentarios -->
                    <article class="container-dos-comentarios" onclick="avisoComentario()">


                        <!-- div com os icones e o primeiro comentario -->
                        <div class="icone-e-primeiro-comentario">

                            <svg class="img-comentario" width="20" height="20" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.5 3L2.5 3.00002C1.67157 3.00002 1 3.6716 1 4.50002V9.50003C1 10.3285 1.67157 11 2.5 11H7.50003C7.63264 11 7.75982 11.0527 7.85358 11.1465L10 13.2929V11.5C10 11.2239 10.2239 11 10.5 11H12.5C13.3284 11 14 10.3285 14 9.50003V4.5C14 3.67157 13.3284 3 12.5 3ZM2.49999 2.00002L12.5 2C13.8807 2 15 3.11929 15 4.5V9.50003C15 10.8807 13.8807 12 12.5 12H11V14.5C11 14.7022 10.8782 14.8845 10.6913 14.9619C10.5045 15.0393 10.2894 14.9965 10.1464 14.8536L7.29292 12H2.5C1.11929 12 0 10.8807 0 9.50003V4.50002C0 3.11931 1.11928 2.00003 2.49999 2.00002Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>

                            <p class="primeiro-comentario">Ninguém abriu o bico ainda. Seja o primeiro a comentar!</p>
                        </div>




                    </article>


                </div>

                


            </article>
        
        </section>


    </main>

    <script src="../../../dist/global/ts/indentidadeUser.js"></script>
    <script src="../../../dist/global/ts/postagem.js"></script>
</body>
</html>
