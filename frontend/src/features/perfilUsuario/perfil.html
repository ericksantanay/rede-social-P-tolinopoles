<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="../../style/global.css">
    <link rel="shortcut icon" href="../../../public/favicon.ico" type="image/x-icon">
</head>
<body>
    
    <header>

        <!-- Area de navegação -->
        <nav>
            <div id="logo-nome">
                <img src="../../../public/pato-logo.png" alt="Logo Pátolinopoles">
                <h1>Pátolinopoles</h1>
            </div>

            <!-- Perfil do Usuários -->
            <div id="perfil-user">
                <svg width="20" height="20" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 0.875C5.49797 0.875 3.875 2.49797 3.875 4.5C3.875 6.15288 4.98124 7.54738 6.49373 7.98351C5.2997 8.12901 4.27557 8.55134 3.50407 9.31167C2.52216 10.2794 2.02502 11.72 2.02502 13.5999C2.02502 13.8623 2.23769 14.0749 2.50002 14.0749C2.76236 14.0749 2.97502 13.8623 2.97502 13.5999C2.97502 11.8799 3.42786 10.7206 4.17091 9.9883C4.91536 9.25463 6.02674 8.87499 7.49995 8.87499C8.97317 8.87499 10.0846 9.25463 10.8291 9.98831C11.5721 10.7206 12.025 11.8799 12.025 13.5999C12.025 13.8623 12.2376 14.0749 12.5 14.0749C12.7623 14.075 12.975 13.8623 12.975 13.6C12.975 11.72 12.4778 10.2794 11.4959 9.31166C10.7244 8.55135 9.70025 8.12903 8.50625 7.98352C10.0187 7.5474 11.125 6.15289 11.125 4.5C11.125 2.49797 9.50203 0.875 7.5 0.875ZM4.825 4.5C4.825 3.02264 6.02264 1.825 7.5 1.825C8.97736 1.825 10.175 3.02264 10.175 4.5C10.175 5.97736 8.97736 7.175 7.5 7.175C6.02264 7.175 4.825 5.97736 4.825 4.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                
                <!-- Nome do usuário -->
                <p class="nome-usuario"></p>
            </div>
        </nav>
    
    </header>


    <!-- MAIN -->
    <main>

        <!-- Card com os dados do perfil -->
        <section id="container-perfil">

            <!-- Lado esquerdo -->
            <article id="lado-esquerdo">

                <img id="foto-perfil" src="../../assets/image/FT PERFIL.png" alt="Foto de perfil">
                <input type="file" name="foto" id="foto">

            </article>


            <!-- Lado direito -->
            <article id="lado-direito">

                <div id="perfil-nome-do-usuario">

                    <h2 id="nome-do-usuario">Pato Teste</h2>    
                    <h3 id="nome-com-arroba">@PatoTeste</h3>

                </div>

                <!-- Div com a biografia -->
                <div id="container-biografia">
                    <h4>Biografia</h4>
                    <p id="resultado-da-biografia">Ola esse sou eu o criador dessa nova rede social  que vai revolucionar o mercado</p>

                    <div id="container-editar-biografia">
                        <textarea name="biografiaNovo" id="biografiaNovo" placeholder="Biografia" rows="4"></textarea>
                        

                        <div id="container-btns-biografia">

                            <button id="btn-salvar-biografia">Salvar Biografia</button>
                            <button id="btn-editar-biografia">Editar Biografia</button>
                        
                        </div>

                        
                    </div>

                </div>


                <div id="container-tipo-de-pato">

                    <select name="selecao-tipo-de-pato" id="selecao-tipo-de-pato" >
                        <option value="PatoLegual"  disabled selected>Qual tipo de pato você é ?</option>
                        <option value="PatoMilGrau">Pato Mil Grau</option>
                        <option value="PatoDeboas">Pato Deboas</option>
                        <option value="PatoPistola">Pato Pistola</option>
                        <option value="PatoTímido">Pato Tímido</option>
                        <option value="PatoIntrometido">Pato Intrometido</option>
                        <option value="PatoCodador">Pato Codador</option>
                        <option value="PatoBugado">Pato Bugado</option>
                        <option value="PatoSniper">Pato Sniper</option>
                        <option value="PatoGambiarra">Pato Gambiarra</option>
                        <option value="PatoLógico">Pato Lógico</option>
                        <option value="PatoZumbi">Pato Zumbi</option>
                        <option value="PatoTurista">Pato Turista</option>
                        <option value="PatoAlpha">Pato Alpha</option>
                        <option value="PatoEremita">Pato Eremita</option>
                        <option value="PatoCiborgue">Pato Ciborgue</option>
                        <option value="PatoDetetive">Pato Detetive</option>
                        <option value="PatoOstentação">Pato Ostentação</option>
                    </select>


                    <div id="resultado-tipo-de-pato">
                        <!-- Aqui vai os tipos de pato que as pessoas são -->
                        
                        <div class="tipo-de-pato">
                            <p>Pato Tímido</p>
                        </div>

                        <div class="tipo-de-pato">
                            <p>Pato Tímido</p>
                        </div>

                        <div class="tipo-de-pato">
                            <p>Pato Tímido</p>
                        </div>

                        <div class="tipo-de-pato">
                            <p>Pato Tímido</p>
                        </div>

                        <div class="tipo-de-pato">
                            <p>Pato Tímido</p>
                        </div>


                    </div>

                </div>


            </article>

        </section>



    </main>





    <!-- Fazer um outro arquivo carregando só o nome do usuario! -->
    <script src="../../../dist/features/usuariosSecao/usuario.js"></script>

</body>
</html>
